packages:
  - 'packages'
  - 'packages/@monomind/*'
  - 'packages/@monoes/*'
  - 'packages/plugins/*'
  - 'packages/monofence-ai'

overrides:
  hono: '>=4.12.34'
  '@hono/node-server': '>=2.0.5'
  ws: '>=8.20.1'
  axios: '>=1.16.0'
  qs: '>=6.16.0'
  esbuild: '>=0.28.1'
  protobufjs: '>=8.6.6'
  '@protobufjs/utf8': '>=1.1.1'
  '@grpc/grpc-js': '>=1.14.4'
  vite: '>=8.0.16'
  postcss: '>=8.5.18'
  fast-uri: '>=4.1.3'
  '@xmldom/xmldom': '>=0.8.15'
  form-data: '>=4.0.6'
  ip-address: '>=10.1.1'
  js-yaml: '>=4.2.0'
  undici: '>=7.28.0'
  http-proxy-middleware: '>=3.0.7'
  follow-redirects: '>=1.16.0'
  '@anthropic-ai/claude-code': '>=2.1.163'
  handlebars: '>=4.7.9'
  onnxruntime-node: '>=1.27.0'
  sharp: '>=0.35.0'
  adm-zip: '>=0.6.0'
  body-parser: '>=1.20.6'
  better-sqlite3: '>=12.0.0'
  nanoid: '>=3.3.17'

peerDependencyRules:
  allowedVersions:
    tree-sitter: '0.22.4'
    marked: '16'
    '@vitest/coverage-v8': '4.1.4'
    vitest: '4.1.4'
    vite: '8'

onlyBuiltDependencies:
  - better-sqlite3
  - node-tree-sitter
  - tree-sitter
  - tree-sitter-c
  - tree-sitter-c-sharp
  - tree-sitter-cli
  - tree-sitter-cpp
  - tree-sitter-dart
  - tree-sitter-go
  - tree-sitter-java
  - tree-sitter-javascript
  - tree-sitter-kotlin
  - tree-sitter-php
  - tree-sitter-python
  - tree-sitter-ruby
  - tree-sitter-rust
  - tree-sitter-scala
  - tree-sitter-swift
  - tree-sitter-typescript
  - tree-sitter-vue
