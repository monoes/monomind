version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Exact pins with embedded lockfiles (src/utils/optional-deps.ts): moving the
      # package.json range alone makes init reinstall them. The "Claude SDK refresh"
      # workflow moves the SDK; the other two move with a hand-edited pin and lock.
      - dependency-name: '@anthropic-ai/claude-agent-sdk'
      - dependency-name: '@huggingface/transformers'
      - dependency-name: '@puppeteer/browsers'
    groups:
      # Native and ABI-coupled: the core and every grammar have to move together.
      tree-sitter:
        patterns: ['tree-sitter', 'tree-sitter-*']
      npm-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['tree-sitter', 'tree-sitter-*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
