name: Agent Regression Benchmarks

on:
  pull_request:
    paths:
      - 'packages/@monomind/cli/src/agents/**'
      - 'packages/@monomind/routing/src/**'
      - 'packages/@monomind/hooks/src/**'
      - 'tests/benchmarks/**'
      - '.github/workflows/agent-regression.yml'
  push:
    branches: [main]
    paths:
      - 'packages/@monomind/cli/src/agents/**'
      - 'tests/benchmarks/**'

concurrency:
  group: agent-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Agent Quality Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        # npm install, not npm ci — this is a pnpm repo with no
        # package-lock.json, which `npm ci` requires.
        run: npm install

      - name: Install CLI package dependencies
        working-directory: packages/@monomind/cli
        # npm install, not npm ci — this is a pnpm repo with no
        # package-lock.json, which `npm ci` requires.
        run: npm install

      - name: Build CLI package
        working-directory: packages/@monomind/cli
        run: npm run build

      - name: Run regression benchmarks
        run: npx vitest run tests/benchmarks/
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CI: true

      - name: Check regression threshold
        run: |
          node -e "
          const { BenchmarkRunner } = require('./packages/@monomind/cli/dist/benchmarks/benchmark-runner.js');
          const runner = new BenchmarkRunner();
          runner.checkRegressionGate().then(ok => {
            if (!ok) {
              console.error('Quality regression detected — pass rate dropped below baseline threshold');
              process.exit(1);
            }
            console.log('All benchmarks within acceptable range of baseline');
          }).catch(err => {
            console.warn('Regression gate check failed (no baseline set yet):', err.message);
          });
          "
        env:
          CI: true
        continue-on-error: true

  # The former `unit-tests` job moved to tests.yml. It could never have worked
  # here: this workflow's `on:` filter limits it to four paths, and the job
  # installed with `npm ci` against a pnpm repo that has no package-lock.json.
  # tests.yml runs on every PR/push and covers the root suite plus each
  # package suite.
