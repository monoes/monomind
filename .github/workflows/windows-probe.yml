name: Windows Probe

# TEMPORARY. A manual-dispatch loop for fixing monodesign's Windows failures.
#
# The suite could not run on Windows at all until the test glob was fixed; with
# that done it reports real failures, and there is no Windows machine here to
# iterate against. This job exists purely to re-measure after each batch of
# fixes. Delete it once monodesign is gated in tests.yml — a probe left lying
# around becomes a workflow nobody remembers the purpose of.
on:
  workflow_dispatch:

jobs:
  monodesign:
    name: monodesign (windows probe)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Disable git autocrlf
        run: git config --global core.autocrlf false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # node:test with --experimental-strip-types; Node 20 rejects the flag.
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        shell: bash
        run: pnpm install --no-frozen-lockfile --ignore-scripts --filter "@monoes/monodesign..."

      # continue-on-error so the summary below always runs: while iterating, the
      # count IS the result, and a hard stop at the test step would hide it.
      - name: Run tests
        id: tests
        continue-on-error: true
        working-directory: packages/@monoes/monodesign
        shell: bash
        run: npm test 2>&1 | tee /tmp/out.txt
        env:
          CI: true

      - name: Summarise failures
        working-directory: packages/@monoes/monodesign
        shell: bash
        run: |
          echo "=== COUNTS ==="
          grep -E "^# (tests|pass|fail|skipped)" /tmp/out.txt || true
          echo "=== FAILING TESTS ==="
          grep -E "^\s*not ok [0-9]+ - " /tmp/out.txt | sed 's/^ *//' | sort -u || true
          echo "=== DIFFS ==="
          grep -E "^\s+[+-]   '" /tmp/out.txt | sort -u | head -60 || true
