name: Windows Probe

# DISCOVERY, NOT A GATE.
#
# Every suite in this repo has only ever run on macOS (developer machines) and
# ubuntu-latest (tests.yml). Windows is genuinely untested, and several things
# are known to be platform-shaped:
#
#   - permission tests use `chmod 000`, which does not deny reads on Windows
#   - path handling assumes POSIX separators in places
#   - the `._` AppleDouble filtering exists for exFAT and is meaningless there
#   - native modules (tree-sitter grammars, better-sqlite3) must compile with
#     MSVC rather than gcc
#
# Adding windows-latest straight to the tests.yml matrix would very likely turn
# CI permanently red, and a job that is always failing is one people learn to
# ignore — the same reason agent-regression.yml was deleted rather than left
# broken.
#
# So this is manual-dispatch only and `fail-fast: false`: run it, read what
# actually breaks, then promote whatever genuinely passes into tests.yml as a
# real gate with the exclusions written down. Delete this file once that
# promotion happens.
on:
  workflow_dispatch:

concurrency:
  group: windows-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: ${{ matrix.name }} (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      # Every package reports independently — one failure must not hide the
      # state of the other nine, which is the whole point of a discovery run.
      fail-fast: false
      matrix:
        include:
          - name: cli
            pkg: '@monoes/monomindcli'
            dir: packages/@monomind/cli
          - name: monograph
            pkg: '@monoes/monograph'
            dir: packages/@monomind/monograph
          - name: memory
            pkg: '@monoes/memory'
            dir: packages/@monomind/memory
          - name: mcp
            pkg: '@monoes/mcp'
            dir: packages/@monomind/mcp
          - name: routing
            pkg: '@monoes/routing'
            dir: packages/@monomind/routing
          - name: hooks
            pkg: '@monoes/hooks'
            dir: packages/@monomind/hooks
          - name: monofence-ai
            pkg: 'monofence-ai'
            dir: packages/monofence-ai
          - name: monobrowse
            pkg: '@monoes/monobrowse'
            dir: packages/@monoes/monobrowse
          - name: monodesign
            pkg: '@monoes/monodesign'
            dir: packages/@monoes/monodesign
            node: '22'
            build: 'skip'

    steps:
      - uses: actions/checkout@v4
        with:
          # Windows checkout would otherwise rewrite LF to CRLF, which changes
          # file bytes and would make byte-comparison guards (the .claude tree
          # parity check) fail for a reason that has nothing to do with Windows.
          # Keep the working tree identical to what Linux sees.
          fetch-depth: 1

      - name: Disable git autocrlf
        run: git config --global core.autocrlf false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node || '20' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ matrix.node || '20' }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ matrix.node || '20' }}-
            pnpm-${{ runner.os }}-

      # Scope the install to the package under test and its own dependencies.
      # A workspace-wide install makes every leg compile monograph's 15 REQUIRED
      # tree-sitter grammars, so a native-build failure in one grammar takes down
      # all nine legs — which is exactly what the first probe run showed. Only
      # the monograph leg genuinely needs them.
      - name: Install dependencies for ${{ matrix.name }}
        shell: bash
        env:
          # node-gyp's Visual Studio detection spawns a subprocess whose output
          # overflows the default maxBuffer, so it throws
          # ERR_CHILD_PROCESS_STDIO_MAXBUFFER and concludes "Could not find any
          # Visual Studio installation" — on a runner that ships VS 2022. Naming
          # the version skips detection entirely.
          GYP_MSVS_VERSION: '2022'
        # --ignore-scripts: skip native postinstall builds entirely. node-gyp's
        # VS detection is broken on this runner regardless of GYP_MSVS_VERSION
        # (the RangeError is thrown inside its find-VS module before the version
        # hint is consulted), so nothing that needs node-gyp can build here.
        #
        # That is not a dead end — it is the question worth answering: WHICH
        # packages are pure JS and can be gated on Windows today? Those that
        # genuinely need better-sqlite3 or tree-sitter will fail at test time
        # with a clear missing-binding error, and that failure is the finding.
        run: pnpm install --no-frozen-lockfile --ignore-scripts --filter "${{ matrix.pkg }}..."

      - name: Build ${{ matrix.name }}
        if: matrix.build != 'skip'
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: npm run build --if-present

      - name: Run ${{ matrix.name }} tests
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: npm test
        env:
          CI: true
