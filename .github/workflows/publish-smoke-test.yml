name: Publish Smoke Test

# Catches the exact regression class behind P0-1: a package that installs
# "successfully" from npm's perspective but crashes on every command because
# its dependency tree isn't actually complete (e.g. deps only present in the
# monorepo root, not mirrored into the published package.json).
#
# Two entry points:
#   - pack-smoke-test: runs on every PR touching CLI/root packaging surface.
#     Builds locally, `npm pack`s both packages, installs the tarballs into a
#     throwaway project (no monorepo node_modules / hoisting to hide behind),
#     and runs real commands against them. This is the pre-publish gate.
#   - registry-smoke-test: installs the *published* tarballs from the registry
#     itself, so it verifies what real `npm install monomind` users get.
#     Triggers: a pushed `v*` tag, manual dispatch, or a daily schedule.
#
#     The daily schedule is not redundant. Tagging is a manual step that is not
#     part of the publish flow, so releases regularly reach npm untagged and
#     the tag trigger never fires for them: as of 2026-07-26 the remote's
#     newest tag was v2.7.3 while npm was serving 2.7.7, leaving 2.5.7, 2.5.8,
#     2.7.4, 2.7.5, 2.7.6 and 2.7.7 — six published versions — never smoke
#     tested. Since this job installs `@latest` rather than a specific ref, a
#     daily run covers whatever actually shipped, tagged or not.
on:
  workflow_dispatch:
  schedule:
    # 06:20 UTC daily — verifies whatever `@latest` currently resolves to.
    - cron: '20 6 * * *'
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'packages/@monomind/cli/**'
      - 'package.json'
      - '.github/workflows/publish-smoke-test.yml'

concurrency:
  group: publish-smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack-smoke-test:
    name: Pack smoke test (${{ matrix.package.name }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: monomind
            dir: .
            bin: node_modules/monomind/bin/cli.js
          - name: '@monoes/monomindcli'
            dir: packages/@monomind/cli
            bin: node_modules/@monoes/monomindcli/bin/cli.js

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No `cache: npm` — it requires a package-lock.json this pnpm
          # workspace does not have, and setup-node fails the job before any
          # step runs.

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # One workspace install wires the CLI to its sibling packages. The npm
      # installs further down are deliberate and stay npm: they simulate what a
      # real user gets from a tarball and from the registry.
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # `npm run build` inside the CLI package alone type-checks against
      # unbuilt sibling workspace packages (@monoes/monograph, hooks, mcp,
      # memory, routing — all "workspace:*" deps whose types/main point into
      # a gitignored, untracked dist/). A fresh checkout has none of those
      # dist/ dirs, so tsc fails with "Cannot find module '@monoes/monograph'
      # or its corresponding type declarations" (and the same for the other
      # four) before ever reaching the CLI's own code. The pnpm "..." filter
      # selects the CLI plus everything it depends on and builds them in
      # dependency order (memory before hooks, all of them before the CLI).
      - name: Build CLI package (and its workspace dependencies)
        run: pnpm --filter "@monoes/monomindcli..." run build

      # `npm pack` doesn't understand the pnpm "workspace:*" protocol and
      # copies it into the tarball's package.json verbatim (e.g.
      # "@monoes/monograph": "workspace:*") — installing that tarball outside
      # this workspace then fails with EUNSUPPORTEDPROTOCOL. `pnpm pack`
      # rewrites each workspace:* dep to its real resolved version before
      # packing, which is also what `pnpm publish` does for the real release
      # (see prepublishOnly's check-publish-versions.mjs guard) — so this
      # matches what actually ships.
      - name: pnpm pack (${{ matrix.package.name }})
        id: pack
        working-directory: ${{ matrix.package.dir }}
        run: |
          set -euo pipefail
          pnpm pack --json > /tmp/pnpm-pack-output.json
          # The root package's own "prepare" lifecycle script (fires on pack,
          # not just install) writes its own banner to the same stdout ahead
          # of the JSON — sed from the first '{' line so this is robust
          # whether or not a package has a noisy prepare/prepack hook.
          TARBALL="$(sed -n '/^{/,$p' /tmp/pnpm-pack-output.json | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).filename)")"
          echo "tarball_path=$(pwd)/${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "Packed: ${TARBALL}"

      # `pnpm pack` rewrote monomind's "workspace:*" dep on @monoes/monomindcli
      # into a plain version range pinned to whatever's in this checkout's
      # package.json — which is routinely ahead of what's actually on the npm
      # registry (versions get bumped well before a release is cut). A bare
      # `npm install <monomind tarball>` then tries to resolve that sibling
      # from the registry and fails with ETARGET on every PR that hasn't
      # shipped yet, regardless of whether the code itself is broken. Packing
      # the CLI tarball too and installing both together in one npm command
      # lets npm satisfy that dependency from the local tarball instead of
      # the registry — exactly what a real user gets once both are published,
      # without requiring monomindcli to have shipped first.
      - name: pnpm pack (@monoes/monomindcli, monomind's sibling dependency)
        if: matrix.package.name == 'monomind'
        id: pack_cli_sibling
        working-directory: packages/@monomind/cli
        run: |
          set -euo pipefail
          pnpm pack --json > /tmp/pnpm-pack-output-cli-sibling.json
          TARBALL="$(sed -n '/^{/,$p' /tmp/pnpm-pack-output-cli-sibling.json | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).filename)")"
          echo "tarball_path=$(pwd)/${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "Packed: ${TARBALL}"

      - name: Install tarball into a fresh empty project
        run: |
          set -euo pipefail
          INSTALL_DIR="$(mktemp -d)"
          echo "install_dir=${INSTALL_DIR}" >> "$GITHUB_ENV"
          cd "${INSTALL_DIR}"
          npm init -y >/dev/null
          npm install "${{ steps.pack.outputs.tarball_path }}" ${{ steps.pack_cli_sibling.outputs.tarball_path }}

      - name: Run --version against the installed tarball
        working-directory: ${{ env.install_dir }}
        run: |
          set -uo pipefail
          echo "== node ${{ matrix.package.bin }} --version =="
          OUTPUT="$(node "${{ matrix.package.bin }}" --version 2>&1)" && STATUS=0 || STATUS=$?
          echo "${OUTPUT}"
          if [ $STATUS -ne 0 ]; then
            echo "::error::${{ matrix.package.name }} --version exited with status ${STATUS}"
            exit 1
          fi
          if echo "${OUTPUT}" | grep -qiE "cannot find (package|module)|MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND"; then
            echo "::error::${{ matrix.package.name }} --version failed with a missing-module error — the published package is likely missing a dependency (P0-1 class regression)"
            exit 1
          fi

      - name: Run init --help against the installed tarball
        working-directory: ${{ env.install_dir }}
        run: |
          set -uo pipefail
          echo "== node node_modules/.bin/monomind init --help =="
          OUTPUT="$(node node_modules/.bin/monomind init --help 2>&1)" && STATUS=0 || STATUS=$?
          echo "${OUTPUT}"
          if [ $STATUS -ne 0 ]; then
            echo "::error::${{ matrix.package.name }} 'init --help' exited with status ${STATUS}"
            exit 1
          fi
          if echo "${OUTPUT}" | grep -qiE "cannot find (package|module)|MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND"; then
            echo "::error::${{ matrix.package.name }} 'init --help' failed with a missing-module error — the published package is likely missing a dependency (P0-1 class regression)"
            exit 1
          fi

      - name: Clean up temp install dir
        if: always()
        run: rm -rf "${{ env.install_dir }}"

  registry-smoke-test:
    name: Registry smoke test (${{ matrix.package.spec }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package:
          - spec: monomind
            bin: node_modules/monomind/bin/cli.js
          - spec: '@monoes/monomindcli'
            bin: node_modules/@monoes/monomindcli/bin/cli.js

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the published package from npm
        run: |
          set -euo pipefail
          INSTALL_DIR="$(mktemp -d)"
          echo "install_dir=${INSTALL_DIR}" >> "$GITHUB_ENV"
          cd "${INSTALL_DIR}"
          npm init -y >/dev/null
          npm install "${{ matrix.package.spec }}@latest"

      - name: Run --version against the published package
        working-directory: ${{ env.install_dir }}
        run: |
          set -uo pipefail
          OUTPUT="$(node "${{ matrix.package.bin }}" --version 2>&1)" && STATUS=0 || STATUS=$?
          echo "${OUTPUT}"
          if [ $STATUS -ne 0 ]; then
            echo "::error::${{ matrix.package.spec }}@latest --version exited with status ${STATUS}"
            exit 1
          fi
          if echo "${OUTPUT}" | grep -qiE "cannot find (package|module)|MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND"; then
            echo "::error::${{ matrix.package.spec }}@latest --version failed with a missing-module error — the published package on npm is broken (P0-1 class regression)"
            exit 1
          fi

      - name: Run init --help against the published package
        working-directory: ${{ env.install_dir }}
        run: |
          set -uo pipefail
          OUTPUT="$(node node_modules/.bin/monomind init --help 2>&1)" && STATUS=0 || STATUS=$?
          echo "${OUTPUT}"
          if [ $STATUS -ne 0 ]; then
            echo "::error::${{ matrix.package.spec }}@latest 'init --help' exited with status ${STATUS}"
            exit 1
          fi
          if echo "${OUTPUT}" | grep -qiE "cannot find (package|module)|MODULE_NOT_FOUND|ERR_MODULE_NOT_FOUND"; then
            echo "::error::${{ matrix.package.spec }}@latest 'init --help' failed with a missing-module error — the published package on npm is broken (P0-1 class regression)"
            exit 1
          fi

      - name: Clean up temp install dir
        if: always()
        run: rm -rf "${{ env.install_dir }}"

  behaviour-smoke-test:
    name: Published behaviour (does the fix actually ship?)
    # Same triggers as registry-smoke-test: whatever `@latest` resolves to.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # WHY THIS EXISTS, separately from registry-smoke-test:
    #
    # registry-smoke-test asks "does the published package install and run?" —
    # the P0-1 class, a broken dependency tree. It cannot catch a package that
    # installs perfectly and behaves wrongly, and on 2026-07-26 that happened
    # three times in one day:
    #
    #   monomind 2.7.7      — published before the init data-loss fix landed, so
    #                         `init` still deleted user-authored .claude files.
    #                         `init --help` worked fine; the smoke test passed.
    #   @monoes/hooks 1.0.0 — the security-worker fix was committed but the
    #                         version was never bumped, so npm kept serving a
    #                         worker that reported "clean" after aborting a scan.
    #   @monoes/routing 1.0.1 — shipped a dist seven days stale, because a
    #                         leftover tsconfig.tsbuildinfo made `tsc` a no-op
    #                         while exiting 0.
    #
    # Each was caught by a human happening to look. This job asserts BEHAVIOUR
    # against the published artifact, so the next one is caught by a machine.
    #
    # Add a case here whenever a defect reaches users. The bar for inclusion is
    # narrow on purpose: it must be a regression that shipped, be assertable in
    # a few seconds, and fail loudly enough to name what came back.

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the published package from npm
        run: |
          set -euo pipefail
          INSTALL_DIR="$(mktemp -d)"
          echo "install_dir=${INSTALL_DIR}" >> "$GITHUB_ENV"
          cd "${INSTALL_DIR}"
          npm init -y >/dev/null
          npm install monomind@latest
          echo "Installed: $(node -p "require('monomind/package.json').version")"

      # --- 1. init must not delete user-authored files -----------------------
      # Regression: monomind 2.7.7. copySkills/copyCommands/copyAgents swept
      # their target directory and removed every entry init had not itself
      # shipped. A second pre-copy wipe destroyed files INSIDE shipped
      # directories, and only reproduced under --force.
      - name: init preserves user-authored files
        working-directory: ${{ env.install_dir }}
        run: |
          set -euo pipefail
          PROJ="$(mktemp -d)"
          cd "${PROJ}"
          git init -q
          BIN="${{ env.install_dir }}/node_modules/monomind/bin/cli.js"

          node "${BIN}" init >/dev/null 2>&1 || true

          mkdir -p .claude/commands .claude/skills/mine
          echo "USER COMMAND CONTENT" > .claude/commands/mine.md
          echo "USER SKILL CONTENT"   > .claude/skills/mine/SKILL.md
          SHIPPED_SKILL="$(ls .claude/skills 2>/dev/null | grep -v '^mine$' | head -1 || true)"
          if [ -n "${SHIPPED_SKILL}" ]; then
            echo "USER NOTES INSIDE A SHIPPED SKILL" > ".claude/skills/${SHIPPED_SKILL}/my-notes.md"
          fi

          # --force is the path that reproduced the nested deletion; a plain
          # re-run skips the copy entirely and proves nothing.
          node "${BIN}" init --force >/dev/null 2>&1 || true

          FAILED=0
          for f in .claude/commands/mine.md .claude/skills/mine/SKILL.md; do
            if [ ! -f "$f" ]; then
              echo "::error::init deleted a user-authored file: ${f} — the 2.7.7 data-loss regression is back"
              FAILED=1
            fi
          done
          if [ -n "${SHIPPED_SKILL}" ] && [ ! -f ".claude/skills/${SHIPPED_SKILL}/my-notes.md" ]; then
            echo "::error::init deleted a user file nested inside a shipped skill directory — the pre-copy rmSync is back"
            FAILED=1
          fi
          [ $FAILED -eq 0 ] && echo "OK: user-authored files survived init --force"
          exit $FAILED

      # --- 2. the secret gate must block credentials -------------------------
      # Regression class: gates failing open, and NotebookEdit bypassing the
      # secret check entirely because its content field is `new_source`.
      - name: secret gate blocks credentials on Write and NotebookEdit
        working-directory: ${{ env.install_dir }}
        run: |
          set -uo pipefail
          # The root "monomind" package is a thin bin/ wrapper (files: bin/**
          # only) that depends on @monoes/monomindcli — npm installs that as
          # a sibling under node_modules/, not nested inside node_modules/
          # monomind/. The nested packages/@monomind/cli/... path never
          # existed after a real install; verified against a fresh
          # `npm install monomind@latest`.
          HOOK="node_modules/@monoes/monomindcli/.claude/helpers/hook-handler.cjs"
          if [ ! -f "${HOOK}" ]; then
            echo "::error::the published package does not contain .claude/helpers/hook-handler.cjs — the security gates are not shipping at all"
            exit 1
          fi

          # Assembled at runtime: a literal here would be blocked by the very
          # gate under test the moment this file is written.
          CRED="sk-ant-$(printf 'api03')-XXXXXXXXXXXXXXXXXXXXXXXX"
          FAILED=0

          for TOOL in Write NotebookEdit; do
            if [ "$TOOL" = "Write" ]; then
              PAYLOAD="{\"tool_name\":\"Write\",\"tool_input\":{\"file_path\":\"/tmp/x.ts\",\"content\":\"const K = \\\"${CRED}\\\";\"}}"
            else
              PAYLOAD="{\"tool_name\":\"NotebookEdit\",\"tool_input\":{\"notebook_path\":\"/tmp/x.ipynb\",\"cell_id\":\"c1\",\"new_source\":\"K = \\\"${CRED}\\\"\"}}"
            fi
            # `&& ... || ...` guard: GitHub Actions runs bash with -e, so a
            # bare pipeline that exits non-zero aborts the step before $? is
            # captured — and here a non-zero exit is the EXPECTED result.
            echo "${PAYLOAD}" | node "${HOOK}" pre-write >/dev/null 2>&1 && STATUS=0 || STATUS=$?
            if [ $STATUS -ne 2 ]; then
              echo "::error::the secret gate did NOT block a credential via ${TOOL} (exit ${STATUS}, expected 2) — the gate is failing open"
              FAILED=1
            fi
          done

          # A normal edit must still pass, or the gate is unusable.
          echo '{"tool_name":"Write","tool_input":{"file_path":"/tmp/ok.ts","content":"export const x = 1;"}}' \
            | node "${HOOK}" pre-write >/dev/null 2>&1 && OK_STATUS=0 || OK_STATUS=$?
          if [ ${OK_STATUS} -ne 0 ]; then
            echo "::error::the secret gate blocked an ORDINARY edit — it is failing closed on safe input, which makes users disable it"
            FAILED=1
          fi

          [ $FAILED -eq 0 ] && echo "OK: credentials blocked on Write and NotebookEdit; ordinary edits pass"
          exit $FAILED

      # --- 3. the security worker must not claim "clean" after aborting ------
      # Regression: @monoes/hooks 1.0.0. One unreadable path aborted the scan,
      # discarded the secrets it had already found, and reported status "clean".
      - name: security worker reports incomplete, not clean, on an unreadable path
        working-directory: ${{ env.install_dir }}
        run: |
          set -uo pipefail
          PROJ="$(mktemp -d)"
          mkdir -p "${PROJ}/src/locked"
          printf 'const password = "hunter2";\nconst api_key = "abc123";\n' > "${PROJ}/src/locked/creds.ts"
          BIN="${{ env.install_dir }}/node_modules/monomind/bin/cli.js"

          chmod 000 "${PROJ}/src/locked"
          # Skip rather than pass vacuously where chmod does not deny reads
          # (root, or a filesystem without POSIX permissions).
          if cat "${PROJ}/src/locked/creds.ts" >/dev/null 2>&1; then
            chmod 755 "${PROJ}/src/locked"
            echo "::notice::chmod 000 did not deny reads in this environment — skipping rather than passing vacuously"
            exit 0
          fi

          OUTPUT="$(cd "${PROJ}" && CLAUDE_PROJECT_DIR="${PROJ}" node "${BIN}" hooks worker run security 2>&1)" || true
          chmod 755 "${PROJ}/src/locked"
          echo "${OUTPUT}"

          if echo "${OUTPUT}" | grep -q '"status": *"clean"'; then
            echo "::error::the security worker reported \"clean\" over a directory it could not read — the @monoes/hooks 1.0.0 regression is back"
            exit 1
          fi
          if echo "${OUTPUT}" | grep -q 'cvesRemediated'; then
            echo "::error::the security worker is emitting a fabricated cvesRemediated count again"
            exit 1
          fi
          echo "OK: an unreadable path does not produce a clean verdict"

      # --- 4. status must report measured numbers, not constants -------------
      # Regression: 2.7.9. One unguarded access threw and the catch substituted
      # defaults for every panel, so a populated project reported all zeros.
      - name: status reports what is actually on disk
        working-directory: ${{ env.install_dir }}
        run: |
          set -uo pipefail
          PROJ="$(mktemp -d)"
          cd "${PROJ}"
          git init -q
          BIN="${{ env.install_dir }}/node_modules/monomind/bin/cli.js"

          node "${BIN}" init >/dev/null 2>&1 || true
          node "${BIN}" memory store --key smoke-a --value "first entry"  >/dev/null 2>&1 || true
          node "${BIN}" memory store --key smoke-b --value "second entry" >/dev/null 2>&1 || true

          OUTPUT="$(node "${BIN}" status 2>&1)" || true
          echo "${OUTPUT}"

          if echo "${OUTPUT}" | grep -qi "could not read full system state"; then
            echo "::error::status could not read system state — it is falling back to defaults instead of measuring"
            exit 1
          fi
          if echo "${OUTPUT}" | grep -qiE "Backend[^|]*\|[[:space:]]*none"; then
            echo "::error::status reports memory Backend 'none' for a project with a populated store — the fabricated-zeros regression is back"
            exit 1
          fi
          echo "OK: status reflects real state"

      - name: Clean up temp install dir
        if: always()
        run: rm -rf "${{ env.install_dir }}"
