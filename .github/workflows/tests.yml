name: Tests

# Runs the root suite AND every package suite.
#
# Why this workflow exists: before it, no test ever ran in CI.
#
#   1. The only unit-test job lived in agent-regression.yml, whose `on:` filter
#      restricted it to four paths (cli/src/agents/**, routing/src/**,
#      hooks/src/**, tests/benchmarks/**). Changes anywhere else — including
#      most of packages/@monomind/cli/src — triggered nothing.
#   2. That job ran `npx vitest run` from the repo root, whose vitest config
#      includes only `tests/**`. So even when it did fire, none of the package
#      suites (~1,200 CLI, 1,113 monograph, 124 memory, 94 routing, 71 mcp,
#      43 hooks) executed.
#   3. Both jobs installed with `npm ci`, which requires a package-lock.json.
#      This repo is pnpm-based and has none, so the install step could not have
#      succeeded regardless. Run history confirms the workflow never completed.
#
# The original answer to that was `npm install`. That was wrong too, just less
# obviously: this is a pnpm workspace, and npm resolves it differently from what
# developers and `npm publish` actually use. On this workflow's FIRST real run it
# failed every job in ~10s with ERESOLVE — @anthropic-ai/claude-agent-sdk declares
# peer zod@^4 while the repo pins zod@^3.25, a conflict that predates this
# workflow and that pnpm treats as a tolerable unmet optional peer.
#
# So: use pnpm, the package manager this repo is actually built and published
# with. `--frozen-lockfile`: the committed lockfile is consistent, so a PR that
# changes a package.json without updating pnpm-lock.yaml must fail here rather
# than silently resolving something else than what is merged.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only PRs skip the heavy steps (builds, typecheck, tests) of every job
  # below but still run lint and the doc checks. Skipping is done per STEP, not
  # per job: a job-level `if` on a matrix job reports a check named with the
  # unexpanded `${{ matrix.name }}`, which would break required checks.
  # Checks that need the built CLI (skills, trees, doc counts) count as heavy.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # Everything except docs and markdown counts as code. push events
          # (main) compare against the previous commit and are treated alike.
          filters: |
            code:
              - '**'
              - '!doc/**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'

  root:
    name: Root suite
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # On pull requests, skip the "shipped code changed without a version
      # bump" guard (check-package-bumps.mjs): it is a publish-time check that
      # would fail nearly every PR touching a package, and per-PR bumps
      # collide. Pushes to main and release.yml/prepublishOnly keep it.
      # Read by `check:versions` and by tests/repo/publish-bumps.test.ts.
      MONOMIND_ALLOW_STALE_PACKAGES: ${{ github.event_name == 'pull_request' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is kept for the version checks; the package-bump guard
          # that compares against the last release tag is skipped on PRs below.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # Cache the pnpm store, including compiled native modules. Without it
      # every one of the ten matrix jobs recompiles tree-sitter's native
      # grammars from source on every run — slow, and a genuine flake source:
      # on 2026-07-26 the `mcp` job failed at install with
      # `tree-sitter-vue install: make: *** [Makefile:343] Error 126` while the
      # other nine jobs in the same run installed cleanly, and it passed on
      # re-run. A CI that fails randomly teaches people to ignore red.
      # Ask pnpm where its store is rather than hardcoding a path — it is
      # platform-dependent (~/.local/share/pnpm/store on Linux,
      # ~/Library/pnpm/store on macOS). Caching the wrong directory caches
      # nothing, silently, which is worse than no cache at all.
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-22-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-22-
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tests/eval/retrieval/lib.test.ts shells out to `rg`; the runner image
      # does not ship it (spawnSync rg ENOENT).
      - name: Install ripgrep
        if: needs.changes.outputs.code == 'true'
        run: sudo apt-get install -y ripgrep

      - name: Lint
        run: pnpm run lint

      - name: Check doc source references
        run: node scripts/check-doc-refs.mjs

      - name: Check publish versions and workspace pins
        # The package-bump guard is skipped on PRs via the job-level env above;
        # the other checks in check:versions always run.
        run: pnpm run check:versions

      - name: Check test skips are justified
        run: node scripts/ci/check-skips.mjs

      - name: Check tests use no hardcoded /tmp paths
        run: node scripts/ci/check-no-tmp-literals.mjs

      # The CLI imports @monoes/hooks, @monoes/memory and @monoes/monograph as
      # workspace:* deps whose package.json "types"/"main" point at dist/ — pnpm
      # symlinks the source directory, but tsc can't resolve declarations that
      # don't exist yet. Build cli's workspace dependencies (topological order)
      # before building cli itself, or its own build fails with "Cannot find
      # module '@monoes/hooks'" even though the package is correctly linked.
      - name: Build CLI's workspace dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter "@monoes/monomindcli^..." run build

      # The root typecheck scans every package under packages/**, not just the
      # CLI's dependency chain built above — and @monoes/monobrowse/src/cli/
      # platform.ts self-imports '@monoes/monobrowse', which only resolves
      # once this package has built its own dist/. Nothing else in this job
      # otherwise needs monobrowse built, hence the standalone step.
      - name: Build monobrowse (self-imported; needed for root typecheck)
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter "@monoes/monobrowse" run build

      # Same "dist/ must exist" requirement applies to the root typecheck —
      # packages/@monomind/cli/src/{mcp-tools/monograph/visualize-tools.ts,
      # monovector/diff-classifier.ts} import @monoes/monograph's types, which
      # only resolve once the dependency build above has run. Must stay after
      # both builds, not alongside Lint.
      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: pnpm run typecheck

      # Several root tests import from packages/@monomind/cli/dist — e.g.
      # tests/memory/cognee-port-eval.test.mjs pulls dist/src/memory/
      # memory-bridge.js. Without this they fail with ERR_MODULE_NOT_FOUND,
      # which reads like a missing dependency rather than a missing build.
      - name: Build CLI package
        if: needs.changes.outputs.code == 'true'
        working-directory: packages/@monomind/cli
        run: npm run build

      - name: Verify generated platform compatibility documentation
        if: needs.changes.outputs.code == 'true'
        run: node packages/@monomind/cli/bin/cli.js platforms docs --check

      - name: Lint skill packages
        if: needs.changes.outputs.code == 'true'
        run: node scripts/lint-skills.mjs

      - name: Lint agent and skill references
        run: node scripts/lint-agent-refs.mjs

      # Every mcp__monomind__<tool> in the .claude trees and every tool/command
      # in the guidance catalog must exist in the full MCP registry / built
      # CLI, and agent `monomind <cmd>` references must resolve (GH #421).
      - name: Lint MCP tool and CLI command references
        if: needs.changes.outputs.code == 'true'
        run: node scripts/lint-tool-refs.mjs

      # `monomind init --force` rewrites the root .claude/ tree (and
      # .agents/skills) in place, wrapping each file it owns in ownership
      # markers, and never touches the other three copies. An init run in a
      # contributor's checkout therefore leaves the npm-shipped tree and the
      # .gemini/.kimi-code skill trees behind, and leaves markers in files that
      # ship as sources. This is the guard; the fix is
      # `pnpm run sync:claude-trees`.
      - name: Check .claude asset trees are canonical and in sync
        if: needs.changes.outputs.code == 'true'
        run: node scripts/sync-claude-trees.mjs --check

      # Counts quoted in README/doc markers, computed from tracked files plus
      # the skills generated at pack time (see scripts/generate-doc-counts.mjs).
      - name: Check doc-count markers
        if: needs.changes.outputs.code == 'true'
        run: node scripts/generate-doc-counts.mjs --check

      # doc-eval-asserts-fire.test.ts, doc-eval-metrics.test.ts, and
      # knowledge-superseded.test.ts need the real embedding (and reranker)
      # weights on disk to run for real — the eval harness deliberately
      # refuses to download them mid-query (see knowledge/eval/model-presence.ts),
      # so CI has to provision them as an explicit prior step instead, exactly
      # like a human would locally.
      #
      # The weights (~280MB) are cached, because fetching them from
      # huggingface.co on every run failed on 429/499 rate limits (GH issue
      # #511). They live in two places:
      #   - @huggingface/transformers' own `.cache`, beside the installed
      #     package. Its cacheDir is fixed at `<package dir>/.cache` and it
      #     reads no TRANSFORMERS_CACHE/HF_HOME variable, so there is no env
      #     to pin. pnpm installs it under a version-mangled node_modules/.pnpm
      #     path, so resolve that real path rather than hardcoding it.
      #   - ~/.monomind/models, for the reranker classifier head
      #     (rerankerModelsDir() in memory/memory-bridge-backend.ts).
      # The key names the models and the revision provisionModel() pins
      # ('main', in knowledge/eval/model-presence.ts), plus the transformers
      # version, which is part of the cache path.
      - name: Resolve embedding model cache path
        if: needs.changes.outputs.code == 'true'
        id: model-cache-path
        working-directory: packages/@monomind/cli
        run: |
          tf_dir=$(node -p "require('fs').realpathSync('node_modules/@huggingface/transformers')")
          tf_version=$(node -p "require('$tf_dir/package.json').version")
          echo "dir=$tf_dir/.cache" >> "$GITHUB_OUTPUT"
          echo "transformers=$tf_version" >> "$GITHUB_OUTPUT"

      - name: Restore embedding model cache
        if: needs.changes.outputs.code == 'true'
        id: model-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.model-cache-path.outputs.dir }}
            ~/.monomind/models
          key: hf-models-${{ runner.os }}-gte-modernbert-base-ettin-reranker-32m-v1-main-transformers-${{ steps.model-cache-path.outputs.transformers }}
          restore-keys: |
            hf-models-${{ runner.os }}-gte-modernbert-base-ettin-reranker-32m-v1-main-

      # Provisioning skips any model already on disk, so after a cache hit
      # this touches no network. On a miss, transient HuggingFace errors get
      # two retries (20s, then 60s); a third failure fails the job as before.
      - name: Provision embedding models
        if: needs.changes.outputs.code == 'true'
        working-directory: packages/@monomind/cli
        run: |
          delays=(20 60)
          for attempt in 1 2 3; do
            if node bin/cli.js doc eval --provision-model; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=${delays[$((attempt - 1))]}
              echo "::warning::Model provisioning attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::Model provisioning failed after 3 attempts"
          exit 1

      # Saved here, not by actions/cache's post step: that only runs when the
      # whole job succeeds, so one failing test would discard a good download.
      - name: Save embedding model cache
        if: needs.changes.outputs.code == 'true' && (steps.model-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.model-cache-path.outputs.dir }}
            ~/.monomind/models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

      - name: Run root tests
        if: needs.changes.outputs.code == 'true'
        run: npx vitest run --reporter=verbose
        env:
          CI: true

      # Separate process, not vitest: the local MiniLM embedding model does not
      # reliably load inside vitest's worker-pool sandbox, which silently
      # skipped every semantic-quality assertion here instead of running it
      # (GH issue #32). node --test loads the model directly, so hit-rate/
      # blend/rule-dedup checks actually execute in CI.
      - name: Run semantic eval assertions
        if: needs.changes.outputs.code == 'true'
        run: npm run test:semantic-eval
        env:
          CI: true

  windows:
    needs: changes
    name: ${{ matrix.name }} (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mcp
            pkg: '@monoes/mcp'
            dir: packages/@monomind/mcp
          - name: routing
            pkg: '@monoes/routing'
            dir: packages/@monomind/routing
          - name: hooks
            pkg: '@monoes/hooks'
            dir: packages/@monomind/hooks
          - name: monofence-ai
            pkg: 'monofence-ai'
            dir: packages/monofence-ai
          - name: monodesign
            pkg: '@monoes/monodesign'
            dir: packages/@monoes/monodesign
            # Its suite runs under node:test with --experimental-strip-types,
            # which Node 20 rejects outright ("bad option"). The Linux matrix
            # pins 22 for the same reason.
            node: '22'
            # Its build typechecks deliberately-malformed antipattern fixtures
            # and exits 2 by design, and pulls monograph's sources in through
            # the workspace. Nothing to do with Windows; the tests run from
            # source anyway.
            build: 'skip'
          - name: monobrowse
            pkg: '@monoes/monobrowse'
            dir: packages/@monoes/monobrowse
            test: 'skip'

    # WINDOWS COVERAGE, HONESTLY SCOPED.
    #
    # Everything in this repo had only ever run on macOS and Linux. A discovery
    # probe across all nine packages found which ones genuinely pass on Windows
    # and which cannot yet. Gating the ones that pass is real coverage; adding
    # the rest would make this job permanently red, and a job that always fails
    # is one people learn to ignore.
    #
    # STILL EXCLUDED:
    #
    #   cli, monograph,   Need native modules (tree-sitter grammars,
    #   memory            better-sqlite3). node-gyp's Visual Studio detection is
    #                     broken on this runner image: it throws
    #                     ERR_CHILD_PROCESS_STDIO_MAXBUFFER inside its find-VS
    #                     module and concludes no VS exists — on an image that
    #                     ships VS 2022. GYP_MSVS_VERSION does not help, because
    #                     the throw happens before the hint is read. (cli depends
    #                     on both, so filtering it in pulls them along.)
    #
    # RESOLVED, and now gated here rather than described as broken:
    #
    #   monodesign        Now gated, at 1014 passing / 0 failing. It used to run
    #                     ZERO tests here and exit 0 — `node --test
    #                     'tests/*.test.*'` relies on POSIX glob expansion and
    #                     cmd.exe passes the quotes through, so the pattern
    #                     matched nothing. Fixing that exposed 37 real failures,
    #                     which were four distinct bugs:
    #
    #                       - relative paths that become DATA (report entries,
    #                         config output, JSON) leaked '\' separators; only
    #                         15 of 64 call sites normalised
    #                       - teardown called proc.kill() without waiting, and
    #                         Windows will not remove a directory a live process
    #                         holds handles into: EBUSY, after a passing body
    #                       - dynamic import() of a joined path made the ESM
    #                         loader read 'D:' as a URL scheme
    #                       - assertions pinning POSIX literals for values that
    #                         are legitimately native paths
    #
    #                     10 tests skip here vs 2 on Linux: 7 need a puppeteer
    #                     browser the runner lacks, one needs a POSIX shell, one
    #                     is a driveless file URL that is invalid on Windows by
    #                     definition. All skip loudly with a reason.
    #
    #   POSIX-only builds Every package's build used recursive delete, mkdir -p
    #                     and cp directly. npm runs script bodies through
    #                     cmd.exe on Windows — regardless of the shell: below —
    #                     which answers "The syntax of the command is
    #                     incorrect", so monomind could not be BUILT on Windows
    #                     at all. All seven now call scripts/build-fs.mjs
    #                     (Node's own fs, no new dependency). The build step
    #                     below is what keeps that true; it runs under
    #                     shell: cmd so there is no ambiguity about which shell
    #                     is being exercised. monobrowse is in the matrix for
    #                     the build check only (test: 'skip') — its suite drives
    #                     a real browser, which is separate work.
    #
    # --ignore-scripts is deliberate: none of these need a native build, and
    # skipping it sidesteps the node-gyp failure above. hooks reports ~9 skips
    # here by design — its permission tests skip loudly where chmod 000 does not
    # deny reads, rather than passing vacuously.
    steps:
      # BEFORE checkout, not after: this exists to stop checkout rewriting LF
      # to CRLF, and a step that runs afterwards cannot do that — the bytes are
      # already converted by then. It sat after `uses: actions/checkout@v4` and
      # so never had its intended effect, which is how a CRLF-only failure
      # (monodesign's browser-detector freshness guard) reached main.
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Set up Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node || '22' }}

      - name: Set up pnpm
        if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # Deliberately NOT cached, unlike the root/packages jobs. actions/cache's
      # tar+zstd pack/restore does not round-trip pnpm's hardlink-based
      # content-addressable store cleanly on NTFS: every run that restored a
      # cache here — including ones keyed to a lockfile hash known-good on
      # Linux/macOS and even ones this exact job had just saved seconds
      # earlier — failed installing a CDN-tarball dependency with
      # `ERR_PNPM_MISSING_TARBALL_INTEGRITY: its lockfile entry has no
      # "integrity" field`, while every run that got a cache MISS and
      # downloaded fresh succeeded outright. Busting the cache "fixed" it
      # each time only until the next save re-poisoned it. A fresh install
      # costs this job a bit more time; a cache that reliably breaks it costs
      # everyone more.
      - name: Install dependencies for ${{ matrix.name }}
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "${{ matrix.pkg }}..."

      # The install above pulls the workspace siblings in, but a sibling's
      # "types"/"main" point at dist/, which only exists once it is built. hooks
      # resolves monofence-ai and monodesign resolves monobrowse this way since
      # those edges moved to workspace:*; without this the monofence security
      # hooks register zero guards and executor-security-wiring fails with
      # "expected 0 to be greater than 0". A package with no workspace
      # dependencies matches nothing here and exits 0.
      - name: Build ${{ matrix.name }}'s workspace dependencies
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: pnpm --filter "${{ matrix.pkg }}^..." run build

      # Deliberately shell: cmd. This is the step that proves the build scripts
      # are portable, so it must run through the shell that used to break them
      # rather than through git-bash, where POSIX commands would have worked and
      # the check would prove nothing.
      #
      # monodesign sets build: 'skip'. Its `tsc` pulls monograph's sources in
      # through the workspace and demands better-sqlite3/graphology types that
      # --ignore-scripts never installed, and the build is independently
      # expected to exit 2 — it typechecks deliberately-malformed antipattern
      # fixtures. Neither has anything to do with Windows, and its tests run
      # from source, so the build adds no signal here. Its test step still runs.
      - name: Build ${{ matrix.name }} on cmd.exe
        if: needs.changes.outputs.code == 'true' && (matrix.build != 'skip')
        working-directory: ${{ matrix.dir }}
        shell: cmd
        run: npm run build

      # matrix.test is compared as a string on purpose: an unset matrix key is
      # null, and `null != false` is true, so a boolean flag here would silently
      # never skip anything.
      - name: Run ${{ matrix.name }} tests
        if: needs.changes.outputs.code == 'true' && (matrix.test != 'skip')
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: npm test
        env:
          CI: true

  # #768: the authority mask on macOS is a Seatbelt profile; run it for real
  # on a macOS runner (sandbox-exec does not nest, so it cannot be exercised
  # inside another sandbox).
  macos-mask:
    needs: changes
    name: authority mask (macos)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'

      - name: Set up Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up pnpm
        if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@monoes/monomindcli..."

      - name: Build workspace dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter "@monoes/monomindcli^..." run build

      - name: Run the Seatbelt mask tests
        if: needs.changes.outputs.code == 'true'
        working-directory: packages/@monomind/cli
        run: npx vitest run __tests__/orgrt/authority-mask-seatbelt.test.ts
        env:
          CI: true

  packages:
    needs: changes
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One package failing must not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          # cli is not here: it runs sharded in the cli-shards job below.
          - name: monograph
            dir: packages/@monomind/monograph
          - name: memory
            dir: packages/@monomind/memory
            # The one leg that also measures coverage (report uploaded as an
            # artifact; floors in its vitest.config.ts thresholds). The
            # provider is not a repo dependency,
            # so it is added at run time, matched to the installed vitest.
            cmd: 'npm test -- --coverage'
            coverage: true
          - name: mcp
            dir: packages/@monomind/mcp
          - name: routing
            dir: packages/@monomind/routing
          - name: hooks
            dir: packages/@monomind/hooks
          - name: monofence-ai
            dir: packages/monofence-ai
          - name: monobrowse
            dir: packages/@monoes/monobrowse
          - name: monodesign
            dir: packages/@monoes/monodesign
            # node:test, not vitest, and its runner uses
            # --experimental-strip-types, which needs Node 22+.
            node: '22'
            # `npm run build` typechecks the malformed antipattern fixtures and
            # fails by design — see the build step below.
            build: 'skip'
          # monobrowse's suite is deliberately browser-free: every test
          # exercises pure parsing/state/formatting logic, or (in
          # browser-launch.test.ts) only the port-scan branches that resolve
          # before a Chrome binary would ever be exec'd. No Chrome needed.
          #
          # The note that used to sit here claimed three monodesign suites
          # "need a real browser and a live server", and none of that held up:
          #   * live-server / live-poll-stream start their own server. They
          #     failed only because they hardcoded ports (8499/8498) that a
          #     server leaked by an earlier run of those same tests still held.
          #     They now let the server pick a free port.
          #   * detect-antipatterns-browser needed no provisioning either. Its
          #     two failures were one real bug: image-missing-dimensions ran
          #     against every element instead of just <img>, so <head>/<meta>/
          #     <title>/<style> were all flagged. That inflated a clean fixture
          #     to 43 findings and left 33 stale overlays that broke a second,
          #     seemingly-unrelated test. Fixed in cli/engine/rules/checks.mjs.
          # The full suite (1,023 tests) now runs here. The browser tests
          # already pass --no-sandbox when CI is set, which the env below does.

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          # Packages that need a newer runtime set `node` in the matrix.
          node-version: ${{ matrix.node || '22' }}

      - name: Set up pnpm
        if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # Cache the pnpm store, including compiled native modules. Without it
      # every one of the ten matrix jobs recompiles tree-sitter's native
      # grammars from source on every run — slow, and a genuine flake source:
      # on 2026-07-26 the `mcp` job failed at install with
      # `tree-sitter-vue install: make: *** [Makefile:343] Error 126` while the
      # other nine jobs in the same run installed cleanly, and it passed on
      # re-run. A CI that fails randomly teaches people to ignore red.
      # Ask pnpm where its store is rather than hardcoding a path — it is
      # platform-dependent (~/.local/share/pnpm/store on Linux,
      # ~/Library/pnpm/store on macOS). Caching the wrong directory caches
      # nothing, silently, which is worse than no cache at all.
      - name: Resolve pnpm store path
        if: needs.changes.outputs.code == 'true'
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ matrix.node || '20' }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ matrix.node || '20' }}-
            pnpm-${{ runner.os }}-

      # One workspace-wide install wires every package, including the workspace
      # links between them — a per-package `npm install` cannot do that and was
      # resolving each package against the registry instead of its sibling.
      - name: Install workspace dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      # A workspace:* dep's "types"/"main" point at dist/, and the symlink pnpm
      # creates is not enough — tsc needs those dist/ declarations to exist.
      #
      # Build each package's workspace dependencies before its own build/test.
      #
      # This was `if: matrix.name == 'cli'`, on the reasoning that cli was the
      # only matrix package importing siblings not already built by their own
      # job. That stopped being true when the five registry-range sibling
      # edges were converted to workspace:* — hooks now resolves monofence-ai
      # and monodesign resolves monobrowse from the workspace rather than from
      # a prebuilt tarball on npm, so both need their dependencies built here.
      # hooks failed exactly this way: its monofence security hooks registered
      # zero guards, and executor-security-wiring asserted "expected 0 to be
      # greater than 0".
      #
      # Filtering by directory rather than package name reuses matrix.dir, so a
      # package added to the matrix is covered without a second edit. A package
      # with no workspace dependencies prints "No projects matched the filters"
      # and exits 0, which is why this is unconditional.
      - name: Build ${{ matrix.name }}'s workspace dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter "{${{ matrix.dir }}}^..." run build

      # Build before testing: some suites exercise build OUTPUT rather than
      # source — the CLI's knowledge-endpoint test loads dist/src/ui/server.mjs
      # and says so in its own failure message, and the stdio MCP tests spawn
      # the built binary.
      #
      # Skipped where `build: 'skip'`. A STRING sentinel, not a boolean: an
      # unset matrix key is null, and GitHub Actions coerces null == false, so
      # `if: matrix.build != false` evaluated FALSE for every package that did
      # not set the key — silently skipping the build everywhere and leaving the
      # dist-dependent tests failing exactly as before. monodesign is the case: it HAS a build
      # script, but its tsconfig covers tests/fixtures/antipatterns/**, which are
      # deliberately malformed inputs for the detector (a tailwind.config.ts with
      # no tailwind installed, a sample.ts with undeclared types). `tsc` exits 2
      # on them by design, and its suite runs node:test against source anyway —
      # nothing there needs dist.
      - name: Build ${{ matrix.name }}
        if: needs.changes.outputs.code == 'true' && (matrix.build != 'skip')
        working-directory: ${{ matrix.dir }}
        run: npm run build --if-present

      - name: Install coverage provider for ${{ matrix.name }}
        if: needs.changes.outputs.code == 'true' && matrix.coverage == true
        run: |
          v=$(node -p "require('./${{ matrix.dir }}/node_modules/vitest/package.json').version")
          pnpm --filter "{${{ matrix.dir }}}" add -D "@vitest/coverage-v8@$v"

      - name: Run ${{ matrix.name }} tests
        if: needs.changes.outputs.code == 'true'
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmd || 'npm test' }}
        env:
          CI: true

      - name: Upload ${{ matrix.name }} coverage report
        if: needs.changes.outputs.code == 'true' && matrix.coverage == true && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.dir }}/coverage
          if-no-files-found: warn

  # The cli suite (~850 test files, maxWorkers 4) took ~9 minutes as a single
  # leg, so it runs as four vitest shards. Its own job rather than four legs
  # of `packages`: the `cli` aggregate below must need exactly these shards,
  # and `needs:` can only name a whole job, not single matrix legs. Steps
  # mirror the `packages` job; see its comments for the reasoning.
  cli-shards:
    needs: changes
    name: cli shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up pnpm
        if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Resolve pnpm store path
        if: needs.changes.outputs.code == 'true'
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      # Same key as the `packages` legs that set no `node`, so the store is shared.
      - name: Cache pnpm store
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-20-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-20-
            pnpm-${{ runner.os }}-

      - name: Install workspace dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build cli's workspace dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm --filter "{packages/@monomind/cli}^..." run build

      - name: Build cli
        if: needs.changes.outputs.code == 'true'
        working-directory: packages/@monomind/cli
        run: npm run build --if-present

      # Same reasoning as the root job's identical step: cli's doc-eval and
      # knowledge-superseded suites need the real embedding/reranker weights
      # on disk, provisioned as an explicit non-query-time step. Cached and
      # retried exactly as there; see the root job's comments for the paths
      # and the key.
      - name: Resolve embedding model cache path
        if: needs.changes.outputs.code == 'true'
        id: model-cache-path
        working-directory: packages/@monomind/cli
        run: |
          tf_dir=$(node -p "require('fs').realpathSync('node_modules/@huggingface/transformers')")
          tf_version=$(node -p "require('$tf_dir/package.json').version")
          echo "dir=$tf_dir/.cache" >> "$GITHUB_OUTPUT"
          echo "transformers=$tf_version" >> "$GITHUB_OUTPUT"

      - name: Restore embedding model cache
        if: needs.changes.outputs.code == 'true'
        id: model-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.model-cache-path.outputs.dir }}
            ~/.monomind/models
          key: hf-models-${{ runner.os }}-gte-modernbert-base-ettin-reranker-32m-v1-main-transformers-${{ steps.model-cache-path.outputs.transformers }}
          restore-keys: |
            hf-models-${{ runner.os }}-gte-modernbert-base-ettin-reranker-32m-v1-main-

      - name: Provision embedding models
        if: needs.changes.outputs.code == 'true'
        working-directory: packages/@monomind/cli
        run: |
          delays=(20 60)
          for attempt in 1 2 3; do
            if node bin/cli.js doc eval --provision-model; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=${delays[$((attempt - 1))]}
              echo "::warning::Model provisioning attempt $attempt failed; retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::Model provisioning failed after 3 attempts"
          exit 1

      - name: Save embedding model cache
        if: needs.changes.outputs.code == 'true' && (steps.model-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.model-cache-path.outputs.dir }}
            ~/.monomind/models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}

      - name: Run cli tests (shard ${{ matrix.shard }}/4)
        if: needs.changes.outputs.code == 'true'
        working-directory: packages/@monomind/cli
        run: npm test -- --shard=${{ matrix.shard }}/4
        env:
          CI: true

  # Keeps a single check named exactly `cli` (branch protection may require
  # it). always() so it reports even when a shard failed; on docs-only PRs
  # the shards succeed with their heavy steps skipped, so this passes too.
  cli:
    name: cli
    needs: cli-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all cli shards passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "cli shard results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A cli shard did not succeed ($r)"
              exit 1
            fi
          done
