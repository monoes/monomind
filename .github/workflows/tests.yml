name: Tests

# Runs the root suite AND every package suite.
#
# Why this workflow exists: before it, no test ever ran in CI.
#
#   1. The only unit-test job lived in agent-regression.yml, whose `on:` filter
#      restricted it to four paths (cli/src/agents/**, routing/src/**,
#      hooks/src/**, tests/benchmarks/**). Changes anywhere else — including
#      most of packages/@monomind/cli/src — triggered nothing.
#   2. That job ran `npx vitest run` from the repo root, whose vitest config
#      includes only `tests/**`. So even when it did fire, none of the package
#      suites (~1,200 CLI, 1,113 monograph, 124 memory, 94 routing, 71 mcp,
#      43 hooks) executed.
#   3. Both jobs installed with `npm ci`, which requires a package-lock.json.
#      This repo is pnpm-based and has none, so the install step could not have
#      succeeded regardless. Run history confirms the workflow never completed.
#
# The original answer to that was `npm install`. That was wrong too, just less
# obviously: this is a pnpm workspace, and npm resolves it differently from what
# developers and `npm publish` actually use. On this workflow's FIRST real run it
# failed every job in ~10s with ERESOLVE — @anthropic-ai/claude-agent-sdk declares
# peer zod@^4 while the repo pins zod@^3.25, a conflict that predates this
# workflow and that pnpm treats as a tolerable unmet optional peer.
#
# So: use pnpm, the package manager this repo is actually built and published
# with. `--no-frozen-lockfile` because the lockfile legitimately moves when a
# workspace package is version-bumped mid-release.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Root suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Cache the pnpm store, including compiled native modules. Without it
      # every one of the ten matrix jobs recompiles tree-sitter's native
      # grammars from source on every run — slow, and a genuine flake source:
      # on 2026-07-26 the `mcp` job failed at install with
      # `tree-sitter-vue install: make: *** [Makefile:343] Error 126` while the
      # other nine jobs in the same run installed cleanly, and it passed on
      # re-run. A CI that fails randomly teaches people to ignore red.
      # Ask pnpm where its store is rather than hardcoding a path — it is
      # platform-dependent (~/.local/share/pnpm/store on Linux,
      # ~/Library/pnpm/store on macOS). Caching the wrong directory caches
      # nothing, silently, which is worse than no cache at all.
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-20-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-20-
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # The CLI imports @monoes/hooks, @monoes/memory and @monoes/monograph as
      # workspace:* deps whose package.json "types"/"main" point at dist/ — pnpm
      # symlinks the source directory, but tsc can't resolve declarations that
      # don't exist yet. Build cli's workspace dependencies (topological order)
      # before building cli itself, or its own build fails with "Cannot find
      # module '@monoes/hooks'" even though the package is correctly linked.
      - name: Build CLI's workspace dependencies
        run: pnpm --filter "@monoes/monomindcli^..." run build

      # Several root tests import from packages/@monomind/cli/dist — e.g.
      # tests/memory/cognee-port-eval.test.mjs pulls dist/src/memory/
      # memory-bridge.js. Without this they fail with ERR_MODULE_NOT_FOUND,
      # which reads like a missing dependency rather than a missing build.
      - name: Build CLI package
        working-directory: packages/@monomind/cli
        run: npm run build

      - name: Verify generated platform compatibility documentation
        run: node packages/@monomind/cli/bin/cli.js platforms docs --check

      # doc-eval-asserts-fire.test.ts, doc-eval-metrics.test.ts, and
      # knowledge-superseded.test.ts need the real embedding (and reranker)
      # weights on disk to run for real — the eval harness deliberately
      # refuses to download them mid-query (see knowledge/eval/model-presence.ts),
      # so CI has to provision them as an explicit prior step instead, exactly
      # like a human would locally. Not cached: this is a one-time ~280MB
      # fetch per run, and predicting the exact pnpm-mangled cache path to
      # cache reliably isn't worth the complexity for a job that already
      # takes minutes.
      - name: Provision embedding models
        working-directory: packages/@monomind/cli
        run: node bin/cli.js doc eval --provision-model

      - name: Run root tests
        run: npx vitest run --reporter=verbose
        env:
          CI: true

      # Separate process, not vitest: the local MiniLM embedding model does not
      # reliably load inside vitest's worker-pool sandbox, which silently
      # skipped every semantic-quality assertion here instead of running it
      # (GH issue #32). node --test loads the model directly, so hit-rate/
      # blend/rule-dedup checks actually execute in CI.
      - name: Run semantic eval assertions
        run: npm run test:semantic-eval
        env:
          CI: true

  windows:
    name: ${{ matrix.name }} (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mcp
            pkg: '@monoes/mcp'
            dir: packages/@monomind/mcp
          - name: routing
            pkg: '@monoes/routing'
            dir: packages/@monomind/routing
          - name: hooks
            pkg: '@monoes/hooks'
            dir: packages/@monomind/hooks
          - name: monofence-ai
            pkg: 'monofence-ai'
            dir: packages/monofence-ai
          - name: monodesign
            pkg: '@monoes/monodesign'
            dir: packages/@monoes/monodesign
            # Its suite runs under node:test with --experimental-strip-types,
            # which Node 20 rejects outright ("bad option"). The Linux matrix
            # pins 22 for the same reason.
            node: '22'
            # Its build typechecks deliberately-malformed antipattern fixtures
            # and exits 2 by design, and pulls monograph's sources in through
            # the workspace. Nothing to do with Windows; the tests run from
            # source anyway.
            build: 'skip'
          - name: monobrowse
            pkg: '@monoes/monobrowse'
            dir: packages/@monoes/monobrowse
            test: 'skip'

    # WINDOWS COVERAGE, HONESTLY SCOPED.
    #
    # Everything in this repo had only ever run on macOS and Linux. A discovery
    # probe across all nine packages found which ones genuinely pass on Windows
    # and which cannot yet. Gating the ones that pass is real coverage; adding
    # the rest would make this job permanently red, and a job that always fails
    # is one people learn to ignore.
    #
    # STILL EXCLUDED:
    #
    #   cli, monograph,   Need native modules (tree-sitter grammars,
    #   memory            better-sqlite3). node-gyp's Visual Studio detection is
    #                     broken on this runner image: it throws
    #                     ERR_CHILD_PROCESS_STDIO_MAXBUFFER inside its find-VS
    #                     module and concludes no VS exists — on an image that
    #                     ships VS 2022. GYP_MSVS_VERSION does not help, because
    #                     the throw happens before the hint is read. (cli depends
    #                     on both, so filtering it in pulls them along.)
    #
    # RESOLVED, and now gated here rather than described as broken:
    #
    #   monodesign        Now gated, at 1014 passing / 0 failing. It used to run
    #                     ZERO tests here and exit 0 — `node --test
    #                     'tests/*.test.*'` relies on POSIX glob expansion and
    #                     cmd.exe passes the quotes through, so the pattern
    #                     matched nothing. Fixing that exposed 37 real failures,
    #                     which were four distinct bugs:
    #
    #                       - relative paths that become DATA (report entries,
    #                         config output, JSON) leaked '\' separators; only
    #                         15 of 64 call sites normalised
    #                       - teardown called proc.kill() without waiting, and
    #                         Windows will not remove a directory a live process
    #                         holds handles into: EBUSY, after a passing body
    #                       - dynamic import() of a joined path made the ESM
    #                         loader read 'D:' as a URL scheme
    #                       - assertions pinning POSIX literals for values that
    #                         are legitimately native paths
    #
    #                     10 tests skip here vs 2 on Linux: 7 need a puppeteer
    #                     browser the runner lacks, one needs a POSIX shell, one
    #                     is a driveless file URL that is invalid on Windows by
    #                     definition. All skip loudly with a reason.
    #
    #   POSIX-only builds Every package's build used recursive delete, mkdir -p
    #                     and cp directly. npm runs script bodies through
    #                     cmd.exe on Windows — regardless of the shell: below —
    #                     which answers "The syntax of the command is
    #                     incorrect", so monomind could not be BUILT on Windows
    #                     at all. All seven now call scripts/build-fs.mjs
    #                     (Node's own fs, no new dependency). The build step
    #                     below is what keeps that true; it runs under
    #                     shell: cmd so there is no ambiguity about which shell
    #                     is being exercised. monobrowse is in the matrix for
    #                     the build check only (test: 'skip') — its suite drives
    #                     a real browser, which is separate work.
    #
    # --ignore-scripts is deliberate: none of these need a native build, and
    # skipping it sidesteps the node-gyp failure above. hooks reports ~9 skips
    # here by design — its permission tests skip loudly where chmod 000 does not
    # deny reads, rather than passing vacuously.
    steps:
      - uses: actions/checkout@v4

      # Without this, checkout rewrites LF to CRLF, changing file bytes and
      # breaking byte-comparison guards for reasons unrelated to Windows.
      - name: Disable git autocrlf
        run: git config --global core.autocrlf false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node || '20' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Deliberately NOT cached, unlike the root/packages jobs. actions/cache's
      # tar+zstd pack/restore does not round-trip pnpm's hardlink-based
      # content-addressable store cleanly on NTFS: every run that restored a
      # cache here — including ones keyed to a lockfile hash known-good on
      # Linux/macOS and even ones this exact job had just saved seconds
      # earlier — failed installing a CDN-tarball dependency with
      # `ERR_PNPM_MISSING_TARBALL_INTEGRITY: its lockfile entry has no
      # "integrity" field`, while every run that got a cache MISS and
      # downloaded fresh succeeded outright. Busting the cache "fixed" it
      # each time only until the next save re-poisoned it. A fresh install
      # costs this job a bit more time; a cache that reliably breaks it costs
      # everyone more.
      - name: Install dependencies for ${{ matrix.name }}
        shell: bash
        run: pnpm install --no-frozen-lockfile --ignore-scripts --filter "${{ matrix.pkg }}..."

      # Deliberately shell: cmd. This is the step that proves the build scripts
      # are portable, so it must run through the shell that used to break them
      # rather than through git-bash, where POSIX commands would have worked and
      # the check would prove nothing.
      #
      # monodesign sets build: 'skip'. Its `tsc` pulls monograph's sources in
      # through the workspace and demands better-sqlite3/graphology types that
      # --ignore-scripts never installed, and the build is independently
      # expected to exit 2 — it typechecks deliberately-malformed antipattern
      # fixtures. Neither has anything to do with Windows, and its tests run
      # from source, so the build adds no signal here. Its test step still runs.
      - name: Build ${{ matrix.name }} on cmd.exe
        if: matrix.build != 'skip'
        working-directory: ${{ matrix.dir }}
        shell: cmd
        run: npm run build

      # matrix.test is compared as a string on purpose: an unset matrix key is
      # null, and `null != false` is true, so a boolean flag here would silently
      # never skip anything.
      - name: Run ${{ matrix.name }} tests
        if: matrix.test != 'skip'
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: npm test
        env:
          CI: true

  packages:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One package failing must not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - name: cli
            dir: packages/@monomind/cli
          - name: monograph
            dir: packages/@monomind/monograph
          - name: memory
            dir: packages/@monomind/memory
          - name: mcp
            dir: packages/@monomind/mcp
          - name: routing
            dir: packages/@monomind/routing
          - name: hooks
            dir: packages/@monomind/hooks
          - name: monofence-ai
            dir: packages/monofence-ai
          - name: monobrowse
            dir: packages/@monoes/monobrowse
          - name: monodesign
            dir: packages/@monoes/monodesign
            # node:test, not vitest, and its runner uses
            # --experimental-strip-types, which needs Node 22+.
            node: '22'
            # `npm run build` typechecks the malformed antipattern fixtures and
            # fails by design — see the build step below.
            build: 'skip'
          # monobrowse's suite is deliberately browser-free: every test
          # exercises pure parsing/state/formatting logic, or (in
          # browser-launch.test.ts) only the port-scan branches that resolve
          # before a Chrome binary would ever be exec'd. No Chrome needed.
          #
          # The note that used to sit here claimed three monodesign suites
          # "need a real browser and a live server", and none of that held up:
          #   * live-server / live-poll-stream start their own server. They
          #     failed only because they hardcoded ports (8499/8498) that a
          #     server leaked by an earlier run of those same tests still held.
          #     They now let the server pick a free port.
          #   * detect-antipatterns-browser needed no provisioning either. Its
          #     two failures were one real bug: image-missing-dimensions ran
          #     against every element instead of just <img>, so <head>/<meta>/
          #     <title>/<style> were all flagged. That inflated a clean fixture
          #     to 43 findings and left 33 stale overlays that broke a second,
          #     seemingly-unrelated test. Fixed in cli/engine/rules/checks.mjs.
          # The full suite (1,023 tests) now runs here. The browser tests
          # already pass --no-sandbox when CI is set, which the env below does.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Packages that need a newer runtime set `node` in the matrix.
          node-version: ${{ matrix.node || '20' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Cache the pnpm store, including compiled native modules. Without it
      # every one of the ten matrix jobs recompiles tree-sitter's native
      # grammars from source on every run — slow, and a genuine flake source:
      # on 2026-07-26 the `mcp` job failed at install with
      # `tree-sitter-vue install: make: *** [Makefile:343] Error 126` while the
      # other nine jobs in the same run installed cleanly, and it passed on
      # re-run. A CI that fails randomly teaches people to ignore red.
      # Ask pnpm where its store is rather than hardcoding a path — it is
      # platform-dependent (~/.local/share/pnpm/store on Linux,
      # ~/Library/pnpm/store on macOS). Caching the wrong directory caches
      # nothing, silently, which is worse than no cache at all.
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ matrix.node || '20' }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ matrix.node || '20' }}-
            pnpm-${{ runner.os }}-

      # One workspace-wide install wires every package, including the workspace
      # links between them — a per-package `npm install` cannot do that and was
      # resolving each package against the registry instead of its sibling.
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      # cli imports @monoes/hooks, @monoes/memory and @monoes/monograph as
      # workspace:* deps whose "types"/"main" point at dist/ — the symlink pnpm
      # creates is not enough, tsc needs those dist/ declarations to exist.
      # Only cli needs this: it's the only matrix package importing siblings
      # that aren't already built by their own matrix job before this one runs.
      - name: Build cli's workspace dependencies
        if: matrix.name == 'cli'
        run: pnpm --filter "@monoes/monomindcli^..." run build

      # Build before testing: some suites exercise build OUTPUT rather than
      # source — the CLI's knowledge-endpoint test loads dist/src/ui/server.mjs
      # and says so in its own failure message, and the stdio MCP tests spawn
      # the built binary.
      #
      # Skipped where `build: 'skip'`. A STRING sentinel, not a boolean: an
      # unset matrix key is null, and GitHub Actions coerces null == false, so
      # `if: matrix.build != false` evaluated FALSE for every package that did
      # not set the key — silently skipping the build everywhere and leaving the
      # dist-dependent tests failing exactly as before. monodesign is the case: it HAS a build
      # script, but its tsconfig covers tests/fixtures/antipatterns/**, which are
      # deliberately malformed inputs for the detector (a tailwind.config.ts with
      # no tailwind installed, a sample.ts with undeclared types). `tsc` exits 2
      # on them by design, and its suite runs node:test against source anyway —
      # nothing there needs dist.
      - name: Build ${{ matrix.name }}
        if: matrix.build != 'skip'
        working-directory: ${{ matrix.dir }}
        run: npm run build --if-present

      # Same reasoning as the root job's identical step: cli's doc-eval and
      # knowledge-superseded suites need the real embedding/reranker weights
      # on disk, provisioned as an explicit non-query-time step.
      - name: Provision embedding models
        if: matrix.name == 'cli'
        working-directory: ${{ matrix.dir }}
        run: node bin/cli.js doc eval --provision-model

      - name: Run ${{ matrix.name }} tests
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmd || 'npm test' }}
        env:
          CI: true
